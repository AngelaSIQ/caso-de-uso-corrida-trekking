<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Corridas</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Sistema de Corridas de Trekking</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="corridas.html">Corridas</a>
            <a href="equipes.html">Equipes</a>
            <a href="checkpoints.html">Checkpoints</a>
            <a href="passagens.html">Passagens</a>
        </nav>
    </header>

    <main>
        <h2>Cadastrar Corrida</h2>

        <form id="form-corrida">
            <input type="hidden" id="id">

            <label for="nome">Nome da corrida:</label>
            <input type="text" id="nome" required>

            <label for="data">Data:</label>
            <input type="date" id="data" required>

            <button type="submit">Salvar corrida</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>

        <p id="mensagem"></p>

        <h2>Corridas cadastradas</h2>
        <ul id="lista-corridas"></ul>
    </main>

    <script type="module" src="js/interface/corridas.js"></script>
</body>
</html>
