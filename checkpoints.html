<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Checkpoints</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-page="checkpoints">
    <header>
        <h1>Sistema de Corridas de Trekking</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="corridas.html">Corridas</a>
            <a href="equipes.html">Equipes</a>
            <a href="checkpoints.html" aria-current="page">Checkpoints</a>
            <a href="passagens.html">Passagens</a>
        </nav>
    </header>

    <main>
        <h2>Cadastrar Checkpoint</h2>

        <form id="form-checkpoint">
            <input type="hidden" id="id">

            <label for="nome">Nome do checkpoint:</label>
            <input type="text" id="nome" required>

            <label for="local">Local:</label>
            <input type="text" id="local" required>

            <label for="corridaId">Corrida:</label>
            <select id="corridaId" required>
                <option value="">Selecione uma corrida</option>
            </select>

            <button type="submit">Salvar checkpoint</button>
        </form>

        <h2>Checkpoints cadastrados</h2>
        <ul id="lista-checkpoints"></ul>
    </main>

    <script type="module" src="js/interface/checkpoints.js"></script>
</body>
</html>
