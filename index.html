<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipes da Corrida</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= HTML ================= -->

    <div class="container">

        <h1>Equipes da Corrida</h1>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar equipe..."
        >

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Equipe</th>
                    <th>Número</th>
                    <th>Checkpoints</th>
                    <th>Última Passagem</th>
                </tr>
            </thead>

            <tbody id="lista-equipes">
               
            </tbody>

        </table>

    </div>

    <script type="module" src="js/script.js"></script>
</body>

</html>
