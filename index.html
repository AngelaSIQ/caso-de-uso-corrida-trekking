<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipes da Corrida</title>

    <!-- ================= CSS ================= -->
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        #pesquisa {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #333;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .status {
            padding: 5px 10px;
            border-radius: 10px;
            background-color: #ddd;
        }

    </style>
</head>


<body>

    <!-- ================= HTML ================= -->

    <div class="container">

        <h1> Equipes da Corrida</h1>

        <input
            type="text"
            id="pesquisa"
            placeholder=" Pesquisar equipe..."
        >

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Equipe</th>
                    <th>Número</th>
                    <th>Checkpoints</th>
                    <th>Última Passagem</th>
                </tr>
            </thead>

            <tbody id="lista-equipes">
                <!-- O JavaScript irá inserir as equipes aqui -->
            </tbody>

        </table>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Lista de equipes
        const equipes = [

            {
                id: 1,
                nome: "Trilheiros RN",
                numero: 1,
                checkpoints: 5,
                ultimaPassagem: "14:32"
            },

            {
                id: 2,
                nome: "Aventureiros",
                numero: 2,
                checkpoints: 4,
                ultimaPassagem: "14:41"
            },

            {
                id: 3,
                nome: "Exploradores",
                numero: 3,
                checkpoints: 3,
                ultimaPassagem: "14:50"
            },

            {
                id: 4,
                nome: "Equipe Alpha",
                numero: 4,
                checkpoints: 2,
                ultimaPassagem: "15:02"
            }

        ];


        // Função para mostrar as equipes
        function mostrarEquipes(lista) {

            const tabela = document.getElementById("lista-equipes");

            // Limpa a tabela
            tabela.innerHTML = "";


            // Percorre a lista de equipes
            lista.forEach((equipe, index) => {

                const linha = document.createElement("tr");


                linha.innerHTML = `

                    <td>
                        ${index + 1}º
                    </td>

                    <td>
                        ${equipe.nome}
                    </td>

                    <td>
                        ${equipe.numero}
                    </td>

                    <td>
                        ${equipe.checkpoints}
                    </td>

                    <td>
                        ${equipe.ultimaPassagem}
                    </td>

                `;


                tabela.appendChild(linha);

            });

        }


        // Mostra todas as equipes quando a página abre
        mostrarEquipes(equipes);


        // Campo de pesquisa
        const pesquisa = document.getElementById("pesquisa");


        pesquisa.addEventListener("input", function () {

            const texto = pesquisa.value.toLowerCase();


            // Filtra as equipes pelo nome
            const resultado = equipes.filter(function (equipe) {

                return equipe.nome
                    .toLowerCase()
                    .includes(texto);

            });


            // Mostra somente as equipes encontradas
            mostrarEquipes(resultado);

        });

    </script>

</body>

</html>
