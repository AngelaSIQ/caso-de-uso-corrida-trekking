<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking da Corrida</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body data-page="inicio">
    <header>
        <h1>Sistema de Corridas de Trekking</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html" aria-current="page">Início</a>
            <a href="corridas.html">Corridas</a>
            <a href="equipes.html">Equipes</a>
            <a href="checkpoints.html">Checkpoints</a>
            <a href="passagens.html">Passagens</a>
        </nav>
    </header>

    <main class="container">
        <h2>Ranking da corrida</h2>
        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar equipe..."
        >

        <div class="table-wrap">
            <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Equipe</th>
                    <th>Número</th>
                    <th>Checkpoints</th>
                    <th>Última Passagem</th>
                </tr>
            </thead>

            <tbody id="lista-equipes">
               
            </tbody>

            </table>
        </div>
    </main>

    <script type="module" src="js/interface/ranking.js"></script>

</body>

</html>
