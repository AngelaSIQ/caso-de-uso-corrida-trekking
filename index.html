<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipes da Corrida</title>

    <!-- ================= CSS ================= -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        #pesquisa {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #333;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

 
        tr.desclassificada {
            background-color: #ffe6e6;
            color: #a00000;
        }

        .status-tag {
            background-color: #d9534f;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 5px;
        }
    </style>
</head>

<body>

    <!-- ================= HTML ================= -->

    <div class="container">

        <h1>Equipes da Corrida</h1>

        <input
            type="text"
            id="pesquisa"
            placeholder="Pesquisar equipe..."
        >

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Equipe</th>
                    <th>Número</th>
                    <th>Checkpoints</th>
                    <th>Última Passagem</th>
                </tr>
            </thead>

            <tbody id="lista-equipes">
               
            </tbody>

        </table>

    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script>
        // 2.2 e 2.6 - Classe Base com Encapsulamento (#)
        class Equipe {
            #id;
            #nome;
            #numero;
            #checkpoints;
            #ultimaPassagem;

            constructor(id, nome, numero, checkpoints, ultimaPassagem) {
                this.#id = id;
                this.#nome = nome;
                this.#numero = numero;
                this.#checkpoints = checkpoints;
                this.#ultimaPassagem = ultimaPassagem;
            }

            getId() {
                return this.#id;
            }

            getNome() {
                return this.#nome;
            }

            getNumero() {
                return this.#numero;
            }

            getCheckpoints() {
                return this.#checkpoints;
            }

            getUltimaPassagem() {
                return this.#ultimaPassagem;
            }

        
            render(posicao) {
                const linha = document.createElement("tr");

                linha.innerHTML = `
                    <td>${posicao}º</td>
                    <td>${this.#nome}</td>
                    <td>${this.#numero}</td>
                    <td>${this.#checkpoints}</td>
                    <td>${this.#ultimaPassagem}</td>
                `;

                return linha;
            }
        }

        
        class EquipeDesclassificada extends Equipe {
            #motivo;

            constructor(id, nome, numero, checkpoints, ultimaPassagem, motivo) {
                super(id, nome, numero, checkpoints, ultimaPassagem);
                this.#motivo = motivo;
            }

          
            render(posicao) {
                const linha = document.createElement("tr");
                linha.classList.add("desclassificada");

                linha.innerHTML = `
                    <td>-</td>
                    <td>${this.getNome()} <span class="status-tag">Desclassificada (${this.#motivo})</span></td>
                    <td>${this.getNumero()}</td>
                    <td>${this.getCheckpoints()}</td>
                    <td>${this.getUltimaPassagem()}</td>
                `;

                return linha;
            }
        }

        
        const equipes = [
            new Equipe(1, "Trilheiros RN", 1, 5, "14:32"),
            new Equipe(2, "Aventureiros", 2, 4, "14:41"),
            new Equipe(3, "Exploradores", 3, 3, "14:50"),
            new EquipeDesclassificada(4, "Equipe Alpha", 4, 2, "15:02", "Rota Incorreta")
        ];

        function mostrarEquipes(lista) {
            const tabela = document.getElementById("lista-equipes");
            tabela.innerHTML = "";

            let posicao = 1;
            for (const equipe of lista) {
                tabela.appendChild(equipe.render(posicao));
                if (!(equipe instanceof EquipeDesclassificada)) {
                    posicao++;
                }
            }
        }


        mostrarEquipes(equipes);

        
        const pesquisa = document.getElementById("pesquisa");

        pesquisa.addEventListener("input", function () {
            const texto = pesquisa.value.toLowerCase();

            const resultado = equipes.filter(function (equipe) {
                return equipe.getNome().toLowerCase().includes(texto);
            });

            mostrarEquipes(resultado);
        });
    </script>

</body>

</html>
