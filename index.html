<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acompanhamento da Corrida</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>🏃 Acompanhamento da Corrida</h1>
        <p>Trekking IFRN 2026</p>
    </header>

    <main>

        <input
            type="text"
            id="pesquisa"
            placeholder="🔍 Pesquisar equipe..."
        >

        <table>

            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Equipe</th>
                    <th>Número</th>
                    <th>Checkpoints</th>
                    <th>Última passagem</th>
                </tr>
            </thead>

            <tbody id="lista-equipes">
                <!-- O JavaScript vai colocar as equipes aqui -->
            </tbody>

        </table>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
