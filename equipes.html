<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Equipes</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-page="equipes">
    <header>
        <h1>Sistema de Corridas de Trekking</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="corridas.html">Corridas</a>
            <a href="equipes.html" aria-current="page">Equipes</a>
            <a href="checkpoints.html">Checkpoints</a>
            <a href="passagens.html">Passagens</a>
        </nav>
    </header>

    <main>
        <h2>Cadastrar Equipe</h2>

        <form id="form-equipe">
            <input type="hidden" id="id">

            <label for="nome">Nome da equipe:</label>
            <input type="text" id="nome" required>

            <label for="integrantes">Integrantes:</label>
            <input type="text" id="integrantes" required>

            <label for="corridaId">Corrida:</label>
            <select id="corridaId" required>
                <option value="">Selecione uma corrida</option>
            </select>

            <p id="aviso-corridas" aria-live="polite" hidden>
                Nenhuma corrida cadastrada.
                <a href="corridas.html">Cadastre uma corrida primeiro</a>.
            </p>

            <button type="submit">Salvar equipe</button>
            <button type="button" id="cancelar">Cancelar</button>
        </form>

        <p id="mensagem" aria-live="polite"></p>

        <h2>Equipes cadastradas</h2>
        <ul id="lista-equipes"></ul>
    </main>

    <script type="module" src="js/interface/equipes.js"></script>
</body>
</html>
