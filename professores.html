
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professores</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>Gerenciamento de Professores</h1>

        <p>
            <a href="index.html">Voltar para Equipes</a>
        </p>

        <section>
            <h2>Cadastrar professor</h2>

            <form id="form-professor">

                <label for="nome">Nome do professor:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <button type="submit">
                    Cadastrar professor
                </button>

            </form>
        </section>

        <section>
            <h2>Professores cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-professores">
                </tbody>
            </table>
        </section>

    </main>
    <script type="module" src="js/professores.js"></script>
    
</body>
</html>
